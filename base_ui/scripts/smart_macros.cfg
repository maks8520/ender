# ==============================================================================
# Russian Smart Macros for Custom Ender 3 V3 KE Touch UI (OpenKE / GuppyScreen)
# ==============================================================================

[gcode_macro _RU_PAUSE]
description: Умная пауза с парковкой головы и отключением нагрева сопла
gcode:
    {% set E = params.E|default(2.5)|float %}
    {% set x_park = params.X|default(10)|float %}
    {% set y_park = params.Y|default(220)|float %}
    {% set z_park = params.Z|default(10)|float %}

    # Сохраняем базовое состояние печати
    PAUSE_BASE

    # Втягивание филамента и безопасный подъем сопла
    G91
    {% if printer.extruder.can_extrude|lower == 'true' %}
      G1 E-{E} F2100
    {% endif %}
    {% if printer.toolhead.position.z < (printer.toolhead.axis_maximum.z - z_park) %}
      G1 Z{z_park} F600
    {% endif %}

    # Парковка головы у края стола
    G90
    G1 X{x_park} Y{y_park} F6000

    # Сохраняем целевую температуру сопла в переменной _RU_RESUME и выключаем нагрев (M104 S0)
    SET_GCODE_VARIABLE MACRO=_RU_RESUME VARIABLE=target_ext_temp VALUE={printer.extruder.target}
    M104 S0

    {% if params.COOL_BED|default(0)|int == 1 %}
      M140 S0
    {% endif %}

    M117 Пауза печати...

[gcode_macro _RU_RESUME]
description: Умное возобновление печати с прогревом сопла и чистящей линией
variable_target_ext_temp: 0
gcode:
    {% set E = params.E|default(2.5)|float %}

    # Автоматический догрев сопла (если остыло во время паузы)
    {% if printer.extruder.target < (target_ext_temp - 5) and target_ext_temp > 0 %}
      M117 Нагрев сопла...
      M109 S{target_ext_temp}
    {% endif %}

    # Чистящая линия / сброс пластика на краю стола (X5 Y5)
    G90
    G1 X5 Y5 F3000
    G91
    {% if printer.extruder.can_extrude|lower == 'true' %}
      G1 E10 F200
      G1 E-{E} F2100
    {% endif %}
    G90

    # Возобновление печати
    RESUME_BASE
    M117 Печать возобновлена

[gcode_macro _RU_ADAPTIVE_BED_MESH]
description: Адаптивная калибровка сетки только в зоне печати
gcode:
    {% set mesh_min = params.MESH_MIN|default("10,10") %}
    {% set mesh_max = params.MESH_MAX|default("210,210") %}
    BED_MESH_CALIBRATE mesh_min={mesh_min} mesh_max={mesh_max}
